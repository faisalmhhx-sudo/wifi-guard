name: wifi_guard
description: "حارس الواي فاي — تطبيق لاكتشاف ومراقبة الأجهزة المتصلة بشبكتك والتنبيه عند أي دخول جديد."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Networking / scanning
  network_info_plus: ^5.0.3        # SSID, BSSID, IP, gateway, subnet
  network_tools: ^0.4.1            # Host discovery (ping sweep), port scan, mDNS
  wifi_scan: ^0.4.1                # Scan nearby Wi-Fi access points (Android)
  connectivity_plus: ^6.0.3        # Connection state changes
  http: ^1.2.1                     # OUI online lookup + router web control
  dart_ping: ^9.0.1                # ICMP ping tool
  url_launcher: ^6.2.6             # فتح صفحة إدارة الراوتر في المتصفح

  # Storage
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3

  # Notifications & background
  flutter_local_notifications: ^17.1.2
  workmanager: ^0.5.2              # Periodic background scans
  permission_handler: ^11.3.1

  # UI helpers
  fl_chart: ^0.68.0                # Signal / speed charts
  intl: ^0.19.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/oui_prefixes.json
