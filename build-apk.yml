name: بناء APK

# يبني ملف APK تلقائياً عند رفع المشروع أو الضغط على زر التشغيل اليدوي.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل الكود
        uses: actions/checkout@v4

      - name: تجهيز Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: تجهيز Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: توليد ملفات المنصّات
        run: flutter create . --platforms=android

      - name: تثبيت الحزم
        run: flutter pub get

      - name: بناء APK
        run: flutter build apk --release

      - name: رفع ملف APK (حمّله من هنا)
        uses: actions/upload-artifact@v4
        with:
          name: wifi-guard-apk
          path: build/app/outputs/flutter-apk/app-release.apk
